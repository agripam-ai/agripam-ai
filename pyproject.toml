[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agripam-ai"
version = "1.0.0"
description = "Explainable discovery and design of native CRISPR tools for agricultural bacteria"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<1.27", "pandas>=2,<2.1", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
app = ["streamlit>=1.38,<2"]

[tool.setuptools]
packages = ["agripam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["deliverables", "work", ".app_vendor", ".envs", ".tools"]
